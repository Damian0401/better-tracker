services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: better-tracker-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Data Source=/app/data/better-tracker.db
      Auth__Secret: ${AUTH_SECRET:?AUTH_SECRET is required}
      Auth__TokenTtlMinutes: ${AUTH_TOKEN_TTL_MINUTES:-60}
    volumes:
      - backend-data:/app/data
    ports:
      - "5000:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    container_name: better-tracker-frontend
    ports:
      - "3000:8080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
