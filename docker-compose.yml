services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: better-tracker-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-better-tracker};Username=${POSTGRES_USER:?POSTGRES_USER is required};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      Auth__Secret: ${AUTH_SECRET:?AUTH_SECRET is required}
      Auth__TokenTtlMinutes: ${AUTH_TOKEN_TTL_MINUTES:-60}
    ports:
      - "5000:8080"
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:18
    container_name: better-tracker-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-better-tracker}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "4000:5432"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    container_name: better-tracker-frontend
    ports:
      - "3000:8080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
